name: Проверки коннектора
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Проверить версию тега
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
          retention-days: 14
